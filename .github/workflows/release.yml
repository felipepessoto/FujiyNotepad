name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual dry-run: builds and uploads the AOT artifacts for every architecture without creating a
  # GitHub Release. Useful for verifying the multi-arch Native AOT publish on the runners before tagging.
  workflow_dispatch:

permissions:
  contents: write   # required to create the GitHub Release and upload assets

jobs:
  test:
    name: Test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No actions/setup-dotnet: the windows runner image already provides a .NET 10 SDK that global.json
      # (10.0.100, rollForward latestMinor) accepts, so we skip the ~35s SDK re-download.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Test
        run: dotnet test src/FujiyNotepad.slnx --configuration Release

  build:
    name: Publish ${{ matrix.rid }}
    # Not gated on `test`: the AOT publishes run in parallel with the Test job to shorten the release
    # critical path. The final `release` job below still requires BOTH `test` and `build` to succeed.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 and x86 are built on the x64 image; arm64 is built natively on the Windows-on-Arm
          # image, so Native AOT needs no x64 -> arm64 cross-compilation.
          - rid: win-x64
            platform: x64
            os: windows-latest
          - rid: win-x86
            platform: x86
            os: windows-latest
          - rid: win-arm64
            platform: ARM64
            os: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No actions/setup-dotnet: the windows runner images (x64 and arm64) already provide a .NET 10 SDK
      # that global.json (10.0.100, rollForward latestMinor) accepts, so we skip the ~35s SDK re-download.
      # Cache the global NuGet package folder per architecture (self-contained AOT restores arch-specific
      # runtime packs). On a miss it restores from nuget.org as before.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.rid }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.rid }}-
            nuget-${{ runner.os }}-

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          # On a tag push, ref_name is the tag (e.g. v1.2.3); on a manual dry-run it is the branch.
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart('v') } else { "0.0.0-dev" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Native AOT (PublishAot=true in the WinUI csproj) compiles the app to native code: smaller, faster
      # startup, no JIT, and no .NET runtime to install. The app's publish profile
      # (Properties/PublishProfiles/win-<rid>.pubxml) selects the RID and a self-contained publish; passing
      # -p:Platform keeps the RID resolution consistent. WindowsAppSDKSelfContained bundles the Windows App
      # SDK, so each unpackaged build is fully standalone. AOT linking uses the runner's C++ toolchain.
      - name: Publish (Native AOT, self-contained)
        run: >
          dotnet publish src/FujiyNotepad.WinUI/FujiyNotepad.WinUI.csproj
          -c Release
          -p:Platform=${{ matrix.platform }}
          -p:PublishProfile=${{ matrix.rid }}
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/app

      - name: Prepare release layout
        shell: pwsh
        run: .\scripts\prepare-release.ps1 -PublishDir publish\app

      - name: Package
        id: package
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist/FujiyNotepad-$v-${{ matrix.rid }}.zip"
          Compress-Archive -Path publish/app/* -DestinationPath $zip -Force
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Set up winapp CLI
        uses: microsoft/setup-WinAppCli@v0.3

      # Exercise the actual pruned ZIP, including on the native ARM64 runner, before shipping it.
      - name: UI tests from release ZIP
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "${{ steps.package.outputs.zip }}" -DestinationPath publish\verify
          .\scripts\ui-tests.ps1 -Exe "$PWD\publish\verify\FujiyNotepad.WinUI.exe" -ArtifactDir "$PWD"

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-tests-failure-${{ matrix.rid }}
          path: ui-tests-failure.png
          if-no-files-found: ignore

      # Always uploaded (including on the manual dry-run) so each AOT build can be inspected without a release.
      - name: Upload build artifact
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: FujiyNotepad-${{ matrix.rid }}
          path: ${{ steps.package.outputs.zip }}

  release:
    name: Create GitHub Release
    needs: [build, test]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" artifacts/*.zip
          --repo ${{ github.repository }}
          --title "FujiyNotepad ${{ github.ref_name }}"
          --generate-notes
