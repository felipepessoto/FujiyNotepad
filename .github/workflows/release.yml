name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual dry-run: builds and validates final ZIPs without creating a GitHub Release, even on a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test release packaging (headless)
        shell: pwsh
        run: .\scripts\test-prepare-release.ps1

      - name: Test UI harness lifecycle (headless)
        shell: pwsh
        run: .\scripts\test-ui-test-lifecycle.ps1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-quality: ga
          check-latest: false

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Test
        run: dotnet test src/FujiyNotepad.slnx --configuration Release

  build:
    name: Publish ${{ matrix.rid }}
    # Not gated on `test`: the AOT publishes run in parallel with the Test job to shorten the release
    # critical path. The final `release` job below still requires BOTH `test` and `build` to succeed.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 and x86 are built on the x64 image; arm64 is built natively on the Windows-on-Arm
          # image, so Native AOT needs no x64 -> arm64 cross-compilation.
          - rid: win-x64
            platform: x64
            os: windows-latest
          - rid: win-x86
            platform: x86
            os: windows-latest
          - rid: win-arm64
            platform: ARM64
            os: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Install the SDK selected by global.json when absent, using the runner's native architecture
      # (including ARM64 on windows-11-arm). Do not rely on a preinstalled .NET 11 SDK.
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-quality: ga
          check-latest: false

      # Cache the global NuGet package folder per architecture (self-contained AOT restores arch-specific
      # runtime packs). On a miss it restores from nuget.org as before.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.rid }}-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.rid }}-
            nuget-${{ runner.os }}-

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG.TrimStart('v') } else { "0.0.0-dev" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Native AOT (PublishAot=true in the WinUI csproj) compiles the app to native code: smaller, faster
      # startup, no JIT, and no .NET runtime to install. The app's publish profile
      # (Properties/PublishProfiles/win-<rid>.pubxml) selects the RID and a self-contained publish; passing
      # -p:Platform keeps the RID resolution consistent. WindowsAppSDKSelfContained bundles the Windows App
      # SDK, so each unpackaged build is fully standalone. AOT linking uses the runner's C++ toolchain.
      - name: Publish (Native AOT, self-contained)
        run: >
          dotnet publish src/FujiyNotepad.WinUI/FujiyNotepad.WinUI.csproj
          -c Release
          -p:Platform=${{ matrix.platform }}
          -p:PublishProfile=${{ matrix.rid }}
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/app

      - name: Package
        id: package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          PACKAGE_RID: ${{ matrix.rid }}
        run: |
          $zip = "dist\FujiyNotepad-$env:PACKAGE_VERSION-$env:PACKAGE_RID.zip"
          .\scripts\prepare-release.ps1 -PublishDir publish\app -ZipPath $zip
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Preserve built ZIPs before tooling/validation can fail. Artifacts are not GitHub Releases.
      - name: Upload build artifact
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: FujiyNotepad-${{ matrix.rid }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

      - name: Set up winapp CLI
        uses: microsoft/setup-WinAppCli@v0.3

      - name: Validate and exercise final ZIP
        shell: pwsh
        run: >
          .\scripts\test-release-package.ps1
          -ZipPath '${{ steps.package.outputs.zip }}'
          -ExtractDir publish\verify
          -Rid '${{ matrix.rid }}'
          -ArtifactDir diagnostics

      - name: Upload package diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-diagnostics-${{ matrix.rid }}
          path: diagnostics
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: [build, test]
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: FujiyNotepad-win-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" artifacts/*.zip
          --repo ${{ github.repository }}
          --title "FujiyNotepad ${{ github.ref_name }}"
          --generate-notes
