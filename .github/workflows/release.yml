name: Release ZIP validation (temporary)
run-name: v4.16.0 final ZIP validation - ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: win-x86
            runner: windows-latest
          - rid: win-arm64
            runner: windows-11-arm

    steps:
      - name: Checkout validation-only revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Set up winapp CLI
        uses: microsoft/setup-WinAppCli@v0.3
        with:
          version: v0.8.0

      - name: Verify and execute the exact published ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          WINAPP_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          .\scripts\validate-release-zip.ps1 -Rid '${{ matrix.rid }}' `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'validation\${{ matrix.rid }}')

      - name: Preserve verification results, commands, and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-zip-validation-${{ matrix.rid }}
          path: validation\${{ matrix.rid }}\evidence
          if-no-files-found: warn
          retention-days: 90
